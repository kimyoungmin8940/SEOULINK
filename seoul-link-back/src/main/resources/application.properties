spring.application.name=seoul-link-back
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521:xe}
spring.datasource.username=${DB_USERNAME:seoulink}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
openai.api-key=${OPENAI_API_KEY}
openai.model=gpt-4.1-mini
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.front-url=${FRONT_URL:http://localhost:5173}
app.demo-signup-pass-enabled=${DEMO_SIGNUP_PASS_ENABLED:true}
oauth.kakao.client-id=${KAKAO_CLIENT_ID}
oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET}
oauth.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/api/members/oauth/kakao/callback}
oauth.naver.client-id=${NAVER_CLIENT_ID}
oauth.naver.client-secret=${NAVER_CLIENT_SECRET}
oauth.naver.redirect-uri=${NAVER_REDIRECT_URI:http://localhost:8080/api/members/oauth/naver/callback}
oauth.google.client-id=${GOOGLE_CLIENT_ID}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET}
oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/members/oauth/google/callback}
toss.secret-key=${TOSS_SECRET_KEY}
kakao.rest-api-key=${KAKAO_REST_API_KEY}
openrouteservice.api-key=${OPENROUTESERVICE_API_KEY}
place.import.enabled=${PLACE_IMPORT_ENABLED:false}
