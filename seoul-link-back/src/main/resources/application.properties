spring.application.name=seoul-link-back

spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=seoulink
spring.datasource.password=12345
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OpenRouteService Matrix API
# 실제 키는 파일에 작성하지 않고 OPENROUTESERVICE_API_KEY 환경변수에서 읽는다.
external.openroute.base-url=https://api.openrouteservice.org
external.openroute.api-key=${OPENROUTESERVICE_API_KEY:}
external.openroute.profile=${OPENROUTESERVICE_PROFILE:foot-walking}
