# 애플리케이션 식별자
spring.application.name=seoul-link-back
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521:xe}
spring.datasource.username=${DB_USERNAME:seoulink}
spring.datasource.password=${DB_PASSWORD:12345}

# 로컬 Oracle 연결 설정
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
openai.api-key=${OPENAI_API_KEY:}
openai.model=gpt-4.1-mini

# 운영 중인 테이블 구조는 Hibernate가 변경하지 않고 SQL만 개발 로그에 출력한다.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.front-url=${FRONT_URL:http://localhost:5173}
app.demo-signup-pass-enabled=${DEMO_SIGNUP_PASS_ENABLED:false}
toss.secret-key=${TOSS_SECRET_KEY:}
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
openrouteservice.api-key=${OPENROUTESERVICE_API_KEY:}
place.import.enabled=${PLACE_IMPORT_ENABLED:false}
spring.profiles.active=oauth


# OpenRouteService Matrix API
# 실제 키는 파일에 작성하지 않고 OPENROUTESERVICE_API_KEY 환경변수에서 읽는다.
external.openroute.base-url=https://api.openrouteservice.org
external.openroute.api-key=${OPENROUTESERVICE_API_KEY:}
# 공식 무료 Matrix 일일 한도보다 여유를 두고 서버 프로세스당 450회에서 선차단한다.
external.openroute.daily-call-budget=${OPENROUTESERVICE_DAILY_CALL_BUDGET:450}

# ODsay 대중교통 길찾기 API
# 실제 Server 키는 ODSAY_API_KEY 환경변수에서 읽는다.
external.odsay.base-url=https://api.odsay.com/v1/api
external.odsay.api-key=${ODSAY_API_KEY:}
# 공식 1,000건보다 여유를 두고 서버 프로세스당 하루 최대 900회에서 선차단한다.
external.odsay.daily-call-budget=${ODSAY_DAILY_CALL_BUDGET:900}

# 동일 장소 쌍 거리·이동시간 메모리 캐시
course.distance-cache.max-entries=${COURSE_DISTANCE_CACHE_MAX_ENTRIES:20000}
course.distance-cache.ttl-minutes=${COURSE_DISTANCE_CACHE_TTL_MINUTES:1440}
